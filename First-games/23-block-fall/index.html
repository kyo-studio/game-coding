<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>23 落ちものパズル (Block Fall)</title>
  <link rel="stylesheet" href="style.css?v=20260915_1">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">🧱 落ちものパズル</h1>
      <span class="game-badge">#23</span>
    </header>

    <main class="arcade-card">
      <!-- ゲームレイアウト（サイドHUD左 + メイン盤面 + サイドHUD右） -->
      <div class="game-layout">
        <!-- 左サイドパネル (HOLD & SCORE & LEVEL) -->
        <aside class="side-panel left-panel">
          <div class="panel-box hold-box">
            <span class="panel-title">HOLD</span>
            <canvas id="holdCanvas" width="64" height="64" class="mini-canvas"></canvas>
            <span class="key-hint">PC: C / Shift</span>
          </div>

          <div class="panel-box score-box">
            <span class="panel-title">SCORE</span>
            <strong id="score-display" class="stat-value">0</strong>
          </div>

          <div class="panel-box level-box">
            <span class="panel-title">LEVEL</span>
            <strong id="level-display" class="stat-value cyan">1</strong>
          </div>
        </aside>

        <!-- メイン盤面 (Canvas 10×20 / 200x400) -->
        <div class="board-container">
          <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="200" height="400"></canvas>

            <!-- スタートオーバーレイ -->
            <div id="start-overlay" class="game-overlay">
              <div class="overlay-content">
                <div class="overlay-icon">🧱✨🕹️</div>
                <h2>BLOCK FALL</h2>
                <p class="overlay-desc">ブロックを回転・移動させて隙間なく並べ、ラインを一列揃えて消去せよ！</p>
                <div class="control-legend">
                  <span>◀ ▶: 移動 / 🔄: 回転</span>
                  <span>⚡: 即落下 / 📦: HOLD</span>
                </div>
                <button id="start-btn" class="btn btn-primary">START GAME ⚡</button>
              </div>
            </div>

            <!-- ポーズオーバーレイ -->
            <div id="pause-overlay" class="game-overlay hidden">
              <div class="overlay-content">
                <div class="overlay-icon">⏸️</div>
                <h2>PAUSED</h2>
                <button id="resume-btn" class="btn btn-primary">再開する ▶</button>
              </div>
            </div>

            <!-- ゲームオーバーオーバーレイ -->
            <div id="gameover-overlay" class="game-overlay hidden">
              <div class="overlay-content">
                <div class="overlay-icon">💀💥</div>
                <h2 class="gameover-title">GAME OVER</h2>
                <div class="result-stats">
                  <p>最終スコア: <strong id="final-score">0</strong></p>
                  <p>消去ライン: <strong id="final-lines">0</strong></p>
                  <p>到達レベル: <strong id="final-level">1</strong></p>
                  <p id="new-record-badge" class="new-record-badge hidden">✨ NEW RECORD! ✨</p>
                </div>
                <button id="restart-btn" class="btn btn-primary">もう一度挑戦 🔄</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 右サイドパネル (NEXT & LINES & BEST) -->
        <aside class="side-panel right-panel">
          <div class="panel-box next-box">
            <span class="panel-title">NEXT</span>
            <canvas id="nextCanvas" width="64" height="64" class="mini-canvas"></canvas>
            <canvas id="next2Canvas" width="56" height="56" class="mini-canvas mini-sub"></canvas>
          </div>

          <div class="panel-box lines-box">
            <span class="panel-title">LINES</span>
            <strong id="lines-display" class="stat-value green">0</strong>
          </div>

          <div class="panel-box best-box">
            <span class="panel-title">👑 BEST</span>
            <strong id="best-score-display" class="stat-value gold">0</strong>
          </div>
        </aside>
      </div>

      <!-- スマホ用仮想コントロールボタン群 -->
      <div class="virtual-controls">
        <div class="ctrl-row top-ctrl-row">
          <button id="btn-hold" class="ctrl-btn sub-btn" data-action="hold" aria-label="ホールド">📦 HOLD</button>
          <button id="btn-pause" class="ctrl-btn sub-btn" data-action="pause" aria-label="ポーズ">⏸️ PAUSE</button>
          <button id="btn-hard-drop" class="ctrl-btn drop-btn" data-action="hardDrop" aria-label="ハードドロップ">⚡ HARD</button>
        </div>
        <div class="ctrl-row main-ctrl-row">
          <button id="btn-left" class="ctrl-btn arrow-btn" data-action="left" aria-label="左移動">◀</button>
          <button id="btn-soft-drop" class="ctrl-btn arrow-btn" data-action="softDrop" aria-label="ソフトドロップ">▼</button>
          <button id="btn-right" class="ctrl-btn arrow-btn" data-action="right" aria-label="右移動">▶</button>
          <button id="btn-rotate" class="ctrl-btn action-rotate-btn" data-action="rotate" aria-label="回転">🔄 回転</button>
        </div>
      </div>

      <!-- 操作ヒント -->
      <footer class="game-footer">
        <span>操作: <strong>十字キー / WASD / Space (ハード落下) / C (ホールド)</strong></span>
      </footer>
    </main>
  </div>

  <script src="script.js?v=20260915_1"></script>
</body>
</html>
