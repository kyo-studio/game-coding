<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>14 インベーダー風シューティング (Space Invaders)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">👾 インベーダー</h1>
      <span class="game-badge">#14</span>
    </header>

    <main class="arcade-card">
      <!-- HUD（スコア・ライフ・ウェーブ・ベスト） -->
      <section class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <strong id="score-display" class="hud-value">0</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">ライフ</span>
          <span id="lives-display" class="hud-lives">🚀🚀🚀</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">WAVE</span>
          <strong id="wave-display" class="hud-value wave">1</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">👑 ベスト</span>
          <strong id="best-score-display" class="hud-value gold">0</strong>
        </div>
      </section>

      <!-- Canvasゲーム描画エリア（380x460 縦長比率） -->
      <div class="canvas-center-box">
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="380" height="460"></canvas>

          <!-- スタートオーバーレイ -->
          <div id="start-overlay" class="game-overlay">
            <div class="overlay-content">
              <div class="overlay-icon">👾🛸👽</div>
              <h2>SPACE INVADERS</h2>
              <p class="overlay-desc">エイリアン編隊を全滅させろ！<br>最前列の迎撃弾やUFOにも注目！</p>
              <div class="enemy-points-guide">
                <span>🛸 100~300点</span>
                <span>🐙 30点</span>
                <span>👾 20点</span>
                <span>👽 10点</span>
              </div>
              <button id="start-btn" class="btn btn-primary">発進開始 (START) ⚡</button>
            </div>
          </div>

          <!-- ウェーブクリアオーバーレイ -->
          <div id="clear-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">🎉🚀</div>
              <h2 class="clear-title">WAVE CLEAR!</h2>
              <p class="overlay-desc">エイリアン編隊を撃破しました！<br>次のウェーブは敵のスピードが上昇します！</p>
              <button id="next-wave-btn" class="btn btn-primary">NEXT WAVE ⏩</button>
            </div>
          </div>

          <!-- ゲームオーバーオーバーレイ -->
          <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">💥</div>
              <h2 class="gameover-title">GAME OVER</h2>
              <p id="gameover-reason" class="gameover-reason">自機が大破してしまいました！</p>
              <div class="result-stats">
                <p>最終スコア: <strong id="final-score">0</strong> 点</p>
                <p>到達ウェーブ: <strong id="final-wave">1</strong></p>
              </div>
              <p id="new-record-badge" class="new-record-badge hidden">✨ NEW RECORD! ✨</p>
              <button id="restart-btn" class="btn btn-primary">もう一度出撃 🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- スマホ向けバーチャル操作ボタン（左右移動＆発射） -->
      <section class="control-panel">
        <div class="move-buttons">
          <button class="ctrl-btn btn-left" id="btn-left">⬅️</button>
          <button class="ctrl-btn btn-right" id="btn-right">➡️</button>
        </div>
        <button class="ctrl-btn btn-shoot" id="btn-shoot">🔥 SHOT</button>
      </section>

      <!-- 操作ヒント -->
      <footer class="game-footer">
        <span>操作: <strong>[←][→] / [A][D] 移動</strong> | <strong>[Space] 発射</strong></span>
      </footer>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
