<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 反射神経テスト (カラーリアクション)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="header-top">
        <a href="../index.html" class="back-link">← 一覧に戻る</a>
        <span class="game-badge">Game #04</span>
      </div>
      <h1>反射神経テスト</h1>
      <p class="subtitle">Reaction Time Test</p>
    </header>

    <main class="game-card">
      <!-- 統計・ベスト記録ヘッダー -->
      <section class="stats-header">
        <div class="stat-pill">
          <span class="pill-label">👑 最速ベスト</span>
          <strong id="best-single-display" class="pill-value gold">-- ms</strong>
        </div>
        <div class="stat-pill">
          <span class="pill-label">📊 5回平均ベスト</span>
          <strong id="best-avg-display" class="pill-value">-- ms</strong>
        </div>
      </section>

      <!-- 5回テスト進行インジケーター -->
      <section class="progress-section">
        <div class="progress-info">
          <span>ラウンド進捗:</span>
          <span id="round-text" class="round-text">0 / 5</span>
        </div>
        <div class="progress-dots" id="progress-dots">
          <span class="dot" data-step="1"></span>
          <span class="dot" data-step="2"></span>
          <span class="dot" data-step="3"></span>
          <span class="dot" data-step="4"></span>
          <span class="dot" data-step="5"></span>
        </div>
      </section>

      <!-- メインのリアクションエリア（状態によって色とテキストが変化） -->
      <section class="reaction-container">
        <button id="reaction-pad" class="reaction-pad state-idle">
          <div class="pad-inner">
            <span id="pad-icon" class="pad-icon">⚡</span>
            <h2 id="pad-title" class="pad-title">クリックしてスタート</h2>
            <p id="pad-desc" class="pad-desc">画面が「緑」に変わったら、できるだけ速くクリック！</p>
          </div>
        </button>
      </section>

      <!-- 今回の試行履歴リスト -->
      <section class="history-section">
        <div class="history-header">
          <span>今回の測定記録</span>
        </div>
        <div id="history-pills" class="history-pills">
          <span class="empty-text">まだ測定していません</span>
        </div>
      </section>

      <!-- 最終結果モーダル/カード（5回終了時に表示） -->
      <section id="summary-card" class="summary-card hidden">
        <div class="summary-badge">5回テスト完了！</div>
        <div class="summary-main">
          <span class="summary-label">5回 平均反応速度</span>
          <span id="final-avg-time" class="summary-time">0 ms</span>
        </div>
        <div class="summary-stats-grid">
          <div class="summary-stat-box">
            <span class="box-label">⚡ 最速</span>
            <strong id="summary-fastest">0 ms</strong>
          </div>
          <div class="summary-stat-box">
            <span class="box-label">🐢 最遅</span>
            <strong id="summary-slowest">0 ms</strong>
          </div>
        </div>
        <div class="rank-box">
          <span>称号ランク:</span>
          <strong id="summary-rank" class="rank-name">--</strong>
        </div>
        <button id="restart-btn" class="btn btn-primary">もう一度最初から挑戦 🔄</button>
      </section>

      <!-- リセットボタン -->
      <section class="action-section">
        <button id="reset-all-btn" class="btn-text">テストをリセット</button>
      </section>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
