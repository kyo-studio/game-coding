<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 じゃんけんバトル</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="header-top">
        <a href="../index.html" class="back-link">← 一覧に戻る</a>
        <span class="game-badge">Game #02</span>
      </div>
      <h1>じゃんけんバトル</h1>
      <p class="subtitle">Janken Battle</p>
    </header>

    <main class="game-card">
      <!-- 連勝＆最高記録ヘッダー -->
      <section class="streak-banner">
        <div class="streak-item">
          <span class="streak-label">現在の連勝</span>
          <span id="current-streak" class="streak-value">0</span>
        </div>
        <div class="streak-divider"></div>
        <div class="streak-item">
          <span class="streak-label">👑 最高連勝記録</span>
          <span id="best-streak" class="streak-value gold">0</span>
        </div>
      </section>

      <!-- バトルアリーナ（対峙エリア） -->
      <section class="arena-section">
        <!-- プレイヤー側 -->
        <div class="fighter-box player-box">
          <span class="fighter-tag">あなた (YOU)</span>
          <div id="player-hand-display" class="hand-circle">❓</div>
          <span id="player-hand-name" class="hand-name">選択待ち</span>
        </div>

        <!-- VS表示・ステータスメッセージ -->
        <div class="vs-box">
          <span id="vs-text" class="vs-text">VS</span>
          <span id="phase-message" class="phase-message">手を選んでね！</span>
        </div>

        <!-- CPU側 -->
        <div class="fighter-box cpu-box">
          <span class="fighter-tag">CPU</span>
          <div id="cpu-hand-display" class="hand-circle">🤖</div>
          <span id="cpu-hand-name" class="hand-name">待機中</span>
        </div>
      </section>

      <!-- 勝敗結果バナー -->
      <section id="result-banner" class="result-banner hidden">
        <div id="result-text" class="result-text">あなたの勝ち！</div>
        <div id="result-detail" class="result-detail">グーはチョキに勝ちます</div>
      </section>

      <!-- 手の選択ボタン群 -->
      <section class="controls-section">
        <p class="controls-title">出す手を選んでください</p>
        <div class="buttons-grid">
          <button class="hand-btn" data-hand="rock">
            <span class="hand-icon">✊</span>
            <span class="hand-btn-label">グー</span>
          </button>
          <button class="hand-btn" data-hand="scissors">
            <span class="hand-icon">✌️</span>
            <span class="hand-btn-label">チョキ</span>
          </button>
          <button class="hand-btn" data-hand="paper">
            <span class="hand-icon">🖐️</span>
            <span class="hand-btn-label">パー</span>
          </button>
        </div>
      </section>

      <!-- スコアボード（戦績） -->
      <section class="scoreboard-section">
        <div class="score-card">
          <span class="score-num" id="total-matches">0</span>
          <span class="score-label">対戦数</span>
        </div>
        <div class="score-card win">
          <span class="score-num" id="win-count">0</span>
          <span class="score-label">勝ち</span>
        </div>
        <div class="score-card lose">
          <span class="score-num" id="lose-count">0</span>
          <span class="score-label">負け</span>
        </div>
        <div class="score-card draw">
          <span class="score-num" id="draw-count">0</span>
          <span class="score-label">あいこ</span>
        </div>
        <div class="score-card rate">
          <span class="score-num" id="win-rate">0%</span>
          <span class="score-label">勝率</span>
        </div>
      </section>

      <!-- 戦績リセットボタン -->
      <section class="action-section">
        <button id="reset-stats-btn" class="btn-text">戦績をリセットする</button>
      </section>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
