<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>22 マインスイーパー (Minesweeper)</title>
  <link rel="stylesheet" href="style.css?v=20260914_5">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">💣 マインスイーパー</h1>
      <span class="game-badge">#22</span>
    </header>

    <main class="arcade-card">
      <!-- 難易度切り替えタブ -->
      <div class="difficulty-tabs">
        <button class="diff-tab active" data-diff="easy">初級 (9×9)</button>
        <button class="diff-tab" data-diff="medium">中級 (12×12)</button>
        <button class="diff-tab" data-diff="hard">上級 (16×16)</button>
      </div>

      <!-- クラシック風 HUD（地雷カウンター・フェイスボタン・タイマー・ベスト） -->
      <section class="mines-hud">
        <div class="hud-box mine-box">
          <span class="hud-label">🚩 地雷</span>
          <strong id="mines-count" class="digital-display">010</strong>
        </div>

        <!-- フェイスボタン (リセット) -->
        <button id="face-btn" class="face-button" aria-label="リセット / 新しいゲーム">
          <span id="face-icon" class="face-icon">🙂</span>
        </button>

        <div class="hud-box timer-box">
          <span class="hud-label">⏱️ 時間</span>
          <strong id="timer-display" class="digital-display">000</strong>
        </div>

        <div class="hud-box best-box">
          <span class="hud-label">👑 ベスト</span>
          <strong id="best-display" class="digital-display gold">-</strong>
        </div>
      </section>

      <!-- マインスイーパー盤面 (Canvas / 360x360) -->
      <div class="board-center-box">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="gameCanvas" width="360" height="360"></canvas>

          <!-- 勝利オーバーレイ -->
          <div id="win-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">🏆👑✨</div>
              <h2 class="clear-title">STAGE CLEARED!</h2>
              <p class="overlay-desc">すべての地雷を特定し、安全なエリアを完全に解放しました！</p>
              <div class="result-stats">
                <p>クリアタイム: <strong id="win-time">0</strong> 秒</p>
                <p>難易度: <strong id="win-diff">初級</strong></p>
                <p id="new-record-badge" class="new-record-badge hidden">✨ NEW RECORD! ✨</p>
              </div>
              <button id="win-restart-btn" class="btn btn-primary">もう一度遊ぶ 🔄</button>
            </div>
          </div>

          <!-- ゲームオーバーオーバーレイ -->
          <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">💥💣💀</div>
              <h2 class="gameover-title">GAME OVER</h2>
              <p class="overlay-desc">地雷を踏んでしまいました！</p>
              <button id="gameover-restart-btn" class="btn btn-primary">リベンジ 🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作モード切り替えバー (掘る / 旗を立てる) -->
      <div class="mode-toggle-container">
        <button id="mode-dig-btn" class="mode-btn active" data-mode="dig">
          <span class="mode-icon">⛏️</span> 掘る (DIG)
        </button>
        <button id="mode-flag-btn" class="mode-btn" data-mode="flag">
          <span class="mode-icon">🚩</span> 旗を立てる (FLAG)
        </button>
      </div>

      <!-- 操作ヒント -->
      <footer class="game-footer">
        <span>操作: <strong>タップで開く / 旗モードでマーキング</strong>（長押しでも旗立て可能）</span>
      </footer>
    </main>
  </div>

  <script src="script.js?v=20260914_5"></script>
</body>
</html>
