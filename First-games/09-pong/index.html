<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>09 ピンポン (Pong)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">🏓 ピンポン</h1>
      <span class="game-badge">#09</span>
    </header>

    <main class="arcade-card">
      <!-- モード選択＆設定バー -->
      <section class="mode-bar">
        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="vs-cpu">🤖 CPU</button>
          <button class="mode-btn" data-mode="rally">🔁 ラリー</button>
          <button class="mode-btn" data-mode="2p">👥 2人</button>
        </div>
        <!-- CPU難易度セレクタ（vs-cpu時のみ表示） -->
        <div id="difficulty-selector" class="difficulty-group">
          <button class="diff-btn" data-diff="easy">初</button>
          <button class="diff-btn active" data-diff="normal">中</button>
          <button class="diff-btn" data-diff="hard">上</button>
        </div>
      </section>

      <!-- スコアボード（HUD） -->
      <section class="scoreboard">
        <div class="score-side left">
          <span class="player-name" id="p1-name">1P (YOU)</span>
          <span class="score-digits" id="p1-score">0</span>
        </div>
        <div class="match-info">
          <span class="rally-counter" id="rally-count">RALLY: 0</span>
          <span class="target-points" id="target-points">5点先取</span>
        </div>
        <div class="score-side right">
          <span class="player-name" id="p2-name">2P (CPU)</span>
          <span class="score-digits" id="p2-score">0</span>
        </div>
      </section>

      <!-- Canvasゲーム描画エリア -->
      <div class="canvas-center-box">
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="640" height="400"></canvas>

          <!-- スタートオーバーレイ -->
          <div id="start-overlay" class="game-overlay">
            <div class="overlay-content">
              <div class="overlay-icon">🏓</div>
              <h2>CLASSIC PONG</h2>
              <p class="overlay-desc">パドルで打ち返せ！打撃位置で角度変化＆加速！</p>
              <button id="start-btn" class="btn btn-primary">サーブ開始 (PLAY) ⚡</button>
            </div>
          </div>

          <!-- ゲームセット（決着）オーバーレイ -->
          <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon" id="result-icon">🏆</div>
              <h2 id="result-title">YOU WIN!</h2>
              <p id="result-desc" class="result-desc">勝利しました！</p>
              <div class="result-stats">
                <p>最大ラリー数: <strong id="max-rally-display">0</strong> 回</p>
                <p id="best-rally-text">👑 最高記録: <strong id="best-rally-display">0</strong> 回</p>
              </div>
              <button id="restart-btn" class="btn btn-primary">もう一度 🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作ヒント -->
      <footer class="game-footer">
        <span>操作: <strong>画面タッチドラッグ / [W/S] / [↑/↓]</strong></span>
      </footer>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
