<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>13 ブロック崩し (Breakout)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">🧱 ブロック崩し</h1>
      <span class="game-badge">#13</span>
    </header>

    <main class="arcade-card">
      <!-- HUD（スコア・コンボ・ライフ・ベスト） -->
      <section class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <strong id="score-display" class="hud-value">0</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">COMBO</span>
          <strong id="combo-display" class="hud-value combo">0x</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">ライフ</span>
          <span id="lives-display" class="hud-lives">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">👑 ベスト</span>
          <strong id="best-score-display" class="hud-value gold">0</strong>
        </div>
      </section>

      <!-- パワーアップ効果インジケーターバー -->
      <div id="buff-indicator" class="buff-indicator hidden">
        <span id="buff-text" class="buff-text">↔️ WIDE PADDLE (10s)</span>
      </div>

      <!-- Canvasゲーム描画エリア（400x500縦長比率） -->
      <div class="canvas-center-box">
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="400" height="500"></canvas>

          <!-- スタートオーバーレイ -->
          <div id="start-overlay" class="game-overlay">
            <div class="overlay-content">
              <div class="overlay-icon">🧱⚡</div>
              <h2>BREAKOUT</h2>
              <p class="overlay-desc">パドルでボールを打ち返し、すべてのブロックを破壊せよ！</p>
              <div class="items-guide">
                <span>↔️ ワイド</span>
                <span>⚽ マルチ</span>
                <span>⏳ スロー</span>
                <span>❤️ 1UP</span>
              </div>
              <button id="start-btn" class="btn btn-primary">発射開始 (START) ⚡</button>
            </div>
          </div>

          <!-- ステージクリアオーバーレイ -->
          <div id="clear-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">🎉🏆</div>
              <h2 class="clear-title">STAGE CLEAR!</h2>
              <p class="overlay-desc">見事すべてのブロックを完全破壊しました！</p>
              <div class="result-stats">
                <p>クリアスコア: <strong id="clear-score">0</strong> 点</p>
                <p>最大コンボ: <strong id="clear-combo">0</strong>x</p>
              </div>
              <button id="restart-clear-btn" class="btn btn-primary">もう一度遊ぶ 🔄</button>
            </div>
          </div>

          <!-- ゲームオーバーオーバーレイ -->
          <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">💥</div>
              <h2 class="gameover-title">GAME OVER</h2>
              <div class="result-stats">
                <p>最終スコア: <strong id="final-score">0</strong> 点</p>
                <p>最大コンボ: <strong id="final-combo">0</strong>x</p>
              </div>
              <p id="new-record-badge" class="new-record-badge hidden">✨ NEW RECORD! ✨</p>
              <button id="restart-btn" class="btn btn-primary">もう一度挑戦 🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作ヒント -->
      <footer class="game-footer">
        <span>操作: <strong>タッチドラッグ / マウス移動 / [←][→] [A][D]</strong></span>
      </footer>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
