<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 神経衰弱 (カードめくりペア揃え)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="header-top">
        <a href="../index.html" class="back-link">← 一覧に戻る</a>
        <span class="game-badge">Game #06</span>
      </div>
      <h1>神経衰弱</h1>
      <p class="subtitle">Memory Match Card Game</p>
    </header>

    <main class="game-card">
      <!-- 難易度選択タブ -->
      <section class="difficulty-section">
        <span class="section-label">難易度:</span>
        <div class="difficulty-buttons">
          <button class="diff-btn" data-diff="easy">イージー (6枚)</button>
          <button class="diff-btn active" data-diff="normal">ノーマル (12枚)</button>
          <button class="diff-btn" data-diff="hard">ハード (16枚)</button>
        </div>
      </section>

      <!-- ステータスバー（手数・タイム・ペア進捗） -->
      <section class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">手数</span>
          <strong id="moves-count" class="stat-value">0</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">タイム</span>
          <strong id="time-display" class="stat-value">00:00</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">揃ったペア</span>
          <strong id="pairs-display" class="stat-value">0 / 6</strong>
        </div>
      </section>

      <!-- ベスト記録表示 -->
      <section class="best-record-bar">
        <span>👑 自己ベスト: </span>
        <span id="best-moves">-- 手</span> / <span id="best-time">--:--</span>
      </section>

      <!-- カード配置グリッド（JavaScriptで動的生成） -->
      <section class="board-section">
        <div id="card-grid" class="card-grid normal">
          <!-- カード要素がここに動的に生成されます -->
        </div>
      </section>

      <!-- 操作ボタン -->
      <section class="action-section">
        <button id="restart-btn" class="btn btn-secondary">シャッフルしてやり直す 🔄</button>
      </section>

      <!-- クリアモーダル（全ペア成立時に表示） -->
      <div id="clear-modal" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-icon">🎉</div>
          <h2>STAGE CLEAR!</h2>
          <div id="star-rating" class="star-rating">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>
          <div class="clear-details">
            <p>クリア手数: <strong id="final-moves">0</strong> 手</p>
            <p>クリアタイム: <strong id="final-time">00:00</strong></p>
            <p id="new-record-msg" class="new-record-msg hidden">✨ NEW RECORD! 自己ベスト更新！</p>
          </div>
          <button id="modal-restart-btn" class="btn btn-primary">もう一度遊ぶ 🎮</button>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
