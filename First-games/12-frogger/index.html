<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>12 フロッガー風 (Frogger)</title>
  <link rel="stylesheet" href="style.css?v=20260913_zoomfix">
</head>
<body>
  <div class="game-container" id="game-container">
    <!-- コンパクトヘッダー（1行） -->
    <header class="game-header">
      <a href="../index.html" class="back-link">← 一覧</a>
      <h1 class="game-title">🐸 フロッガー</h1>
      <span class="game-badge">#12</span>
    </header>

    <main class="arcade-card">
      <!-- HUD（スコア・ライフ・レベル・タイムバー） -->
      <section class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <strong id="score-display" class="hud-value">0</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">ライフ</span>
          <span id="lives-display" class="hud-lives">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">LEVEL</span>
          <strong id="level-display" class="hud-value level">1</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">👑 ベスト</span>
          <strong id="best-score-display" class="hud-value gold">0</strong>
        </div>
      </section>

      <!-- タイム制限バー -->
      <div class="time-bar-container">
        <div id="time-bar" class="time-bar-fill"></div>
      </div>

      <!-- Canvasゲーム描画エリア（11列x13行 = 396x468） -->
      <div class="canvas-center-box">
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="396" height="468"></canvas>

          <!-- スタートオーバーレイ -->
          <div id="start-overlay" class="game-overlay">
            <div class="overlay-content">
              <div class="overlay-icon hop-anim">🐸🏆</div>
              <h2>FROGGER</h2>
              <p class="overlay-desc">車を避け、丸太に乗って5つのゴール穴にカエルを届けよう！</p>
              <div class="rules-guide">
                <span>🚗 車に激突注意</span>
                <span>🪵 水没注意（丸太に乗れ）</span>
              </div>
              <button id="start-btn" class="btn btn-primary">ゲームスタート (PLAY) ⚡</button>
            </div>
          </div>

          <!-- ステージクリアオーバーレイ -->
          <div id="clear-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">🎉🐸</div>
              <h2 class="clear-title">STAGE CLEAR!</h2>
              <p class="overlay-desc">5匹すべてのカエルを救出しました！<br>次のレベルへ進みます！</p>
              <button id="next-level-btn" class="btn btn-primary">NEXT LEVEL ⏩</button>
            </div>
          </div>

          <!-- ゲームオーバーオーバーレイ -->
          <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-content">
              <div class="overlay-icon">💥</div>
              <h2 class="gameover-title">GAME OVER</h2>
              <div class="result-stats">
                <p>スコア: <strong id="final-score">0</strong> 点</p>
                <p>到達レベル: <strong id="final-level">1</strong></p>
              </div>
              <p id="new-record-badge" class="new-record-badge hidden">✨ NEW RECORD! ✨</p>
              <button id="restart-btn" class="btn btn-primary">もう一度挑戦 🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- スマホ向けバーチャル十字ボタン（D-Pad） -->
      <section class="dpad-container">
        <div class="dpad-grid">
          <button class="dpad-btn dpad-up" data-dir="UP">⬆️</button>
          <div class="dpad-middle">
            <button class="dpad-btn dpad-left" data-dir="LEFT">⬅️</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn dpad-right" data-dir="RIGHT">➡️</button>
          </div>
          <button class="dpad-btn dpad-down" data-dir="DOWN">⬇️</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js?v=20260913_zoomfix"></script>
</body>
</html>
